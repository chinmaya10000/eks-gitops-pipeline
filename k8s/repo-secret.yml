apiVersion: v1
kind: Secret
metadata:
  name: k8s-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  url: git@github.com:chinmaya10000/gitops-argo.git
  sshPrivateKey: |
    # Private key of your machine which has access to the git repo
  insecure: "false"
  enableLfs: "true"
